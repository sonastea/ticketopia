openapi: 3.1.0
info:
  title: Ticketopia API
  version: 1.5.0
  license:
    name: MIT
    identifier: MIT
  description: |
    Read-only event discovery across all Ticketmaster categories, shared with the
    web UI. Event, artist, and venue IDs are provider-scoped (ticketmaster:SOURCE_ID).
    Category and genre IDs are Ticketmaster
    taxonomy IDs. Data is cached, not a live inventory or durable event history.
    Opt-in Google authentication provides MariaDB-backed profiles and private
    preferences, private durable event saves, independent event interest, and public event recommendations.
    Interest identity is private by default; counts include private choices but
    participant lists and profile activity include only explicitly public choices.
    Account APIs use a browser session or a user-scoped API token;
    discovery remains public. Account APIs return 503 when accounts are disabled.
servers:
  - url: /
security: []
paths:
  /healthz:
    get:
      operationId: getLiveness
      summary: Check whether the HTTP server responds
      description: Does not call external APIs or the cache. Remains healthy while draining requests.
      responses:
        '200':
          description: The HTTP server is responding.
          content:
            text/plain:
              schema: {type: string, example: "ok\n"}
  /readyz:
    get:
      operationId: getReadiness
      summary: Check whether the initialized server is accepting traffic
      description: Does not call external APIs or the cache. Returns 503 once the application shutdown context is cancelled.
      responses:
        '200':
          description: The server is initialized and not shutting down.
          content:
            text/plain:
              schema: {type: string, example: "ok\n"}
        '503':
          description: The server is shutting down.
          content:
            text/plain:
              schema: {type: string, example: "not ready\n"}
  /api/v1/events:
    get:
      operationId: listEvents
      summary: Search events across categories
      description: |
        Dates are inclusive venue-local dates, defaulting to today in UTC through
        90 days later. Maximum span is 366 days. Results use Ticketmaster's
        date/name ordering. Pass the same explicit filters with the next cursor.
        Provider pages can shift on refresh; cursors do not pin a snapshot.
        Unknown filters, repeated parameters, and invalid cursors return 400.
        Searches default to all categories. Legacy genre-only searches imply Music.
        Cursors issued before category support must be replaced by a new search.
      parameters:
        - {name: city, in: query, schema: {type: string, maxLength: 120}}
        - {name: country, in: query, description: Two-letter country code., schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - {name: keyword, in: query, schema: {type: string, maxLength: 120}}
        - name: category_id
          in: query
          description: 'Ticketmaster segment ID from /api/v1/categories, or all. Omitted/empty means all categories unless genre_id is supplied, which implies Music for legacy links.'
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}
        - {name: genre_id, in: query, description: 'ID from the selected category’s genres. Explicit category_id=all cannot be combined with a genre. Category/genre combinations follow provider matching and can return no results.', schema: {type: string}}
        - {name: artist_id, in: query, schema: {$ref: '#/components/schemas/ResourceID'}}
        - {name: venue_id, in: query, schema: {$ref: '#/components/schemas/ResourceID'}}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: Events and source freshness. Empty results are cached too.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, total, limited, meta]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Event'}}
                  next_cursor: {type: [string, 'null']}
                  total: {type: integer, minimum: 0, description: 'Total reported by Ticketmaster, including results beyond its paging limit.'}
                  limited: {type: boolean, description: True when further pages exist but the provider's size times page limit prevents access. Narrow the filters.}
                  meta: {$ref: '#/components/schemas/Freshness'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/events/{event_id}:
    get:
      operationId: getEvent
      summary: Read an event and its embedded metadata
      description: Prefers provider/cache data. With saves enabled, retained SQL metadata is served with stale=true when current data is unavailable. No private bookmark state is included.
      parameters:
        - name: event_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/ResourceID'}
      responses:
        '200':
          description: Event data reused from a search, fetched on demand, or retained as last-known SQL metadata.
          content:
            application/json:
              schema:
                type: object
                required: [item, meta]
                properties:
                  item: {$ref: '#/components/schemas/Event'}
                  meta: {$ref: '#/components/schemas/Freshness'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404':
          description: Event not found; cached for five minutes.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/genres:
    get:
      operationId: listGenres
      summary: Read music genres and subgenres
      description: English music taxonomy, sorted by genre name then ID. No query parameters. Use /api/v1/categories for the complete category/genre catalog.
      responses:
        '200':
          description: Music genres, cached for 24 hours.
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Genre'}
                  meta: {$ref: '#/components/schemas/Freshness'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: Read event categories and their compatible genres
      description: English Ticketmaster segments with genres and subgenres. Categories and genres are sorted by name then ID. No query parameters. Types and subtypes are not categories.
      responses:
        '200':
          description: Category catalog, cached for 24 hours with retained fallback for up to seven days.
          content:
            application/json:
              schema:
                type: object
                required: [items, meta]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - {$ref: '#/components/schemas/NamedID'}
                        - type: object
                          required: [genres]
                          properties:
                            genres: {type: array, items: {$ref: '#/components/schemas/Genre'}}
                  meta: {$ref: '#/components/schemas/Freshness'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /api/v1/me:
    get:
      operationId: getOwnAccount
      summary: Read your private account and browser CSRF token
      description: Requires Google sign-in through /auth/sign-in or an API token created in your profile. Cookie responses include csrf_token for subsequent writes; bearer responses omit it. Private responses are never cached.
      security: [{sessionCookie: []}, {bearerToken: []}]
      responses:
        '200':
          description: Your account, including private email and preferences.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: {$ref: '#/components/schemas/Account'}
                  csrf_token: {type: string}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
  /api/v1/me/profile:
    get:
      operationId: getOwnProfile
      summary: Read your profile and interest privacy default
      security: [{sessionCookie: []}, {bearerToken: []}]
      responses:
        '200':
          description: Your editable profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnProfile'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
    patch:
      operationId: updateOwnProfile
      summary: Update your profile and interest privacy default
      description: Cookie writes require X-CSRF-Token and a same-origin request. Bearer writes do not need CSRF. Changing this default affects new interest choices only and does not publish private preferences or hide public recommendations.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                display_name: {type: string, minLength: 1, maxLength: 80}
                bio: {type: string, maxLength: 500}
                interest_visibility: {type: string, enum: [private, public]}
      responses:
        '200':
          description: Updated profile. Omitted fields remain unchanged; null values are rejected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OwnProfile'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
  /api/v1/me/preferences:
    get:
      operationId: getOwnPreferences
      summary: Read your private preferences
      security: [{sessionCookie: []}, {bearerToken: []}]
      responses:
        '200':
          description: Private location, category, time-zone, and future notification preferences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
    patch:
      operationId: updateOwnPreferences
      summary: Update your private preferences
      description: Cookie writes require X-CSRF-Token and a same-origin request. Bearer writes do not need CSRF. Omitted fields remain unchanged; null is rejected. Empty category_ids clears choices. Notification choices are stored only; no reminder or digest is delivered yet.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                city: {type: string, maxLength: 120, description: 'Normalized whitespace; at most 120 UTF-8 bytes, matching discovery filters.'}
                country: {type: string, pattern: '^([A-Za-z]{2})?$'}
                timezone: {type: string, minLength: 1, maxLength: 64, description: 'IANA time zone (not Local). UTC is supported.'}
                category_ids: {type: array, maxItems: 16, items: {type: string, pattern: '^[A-Za-z0-9_-]{1,128}$'}, description: 'Category IDs from the discovery catalog, sorted and deduplicated when stored.'}
                email_reminders: {type: boolean}
                weekly_digest: {type: boolean}
                notifications_paused: {type: boolean}
      responses:
        '200':
          description: Updated private preferences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
  /api/v1/users/{user_id}:
    get:
      operationId: getPublicProfile
      summary: Read a public profile without private account fields
      parameters:
        - {name: user_id, in: path, required: true, schema: {$ref: '#/components/schemas/AccountID'}}
      responses:
        '200':
          description: Public ID, display name, and bio only. Never contains email, location, preferences, credentials, or private activity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicProfile'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '404':
          description: Profile not found, including invalid account IDs.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
  /api/v1/me/tokens:
    get:
      operationId: listOwnAPITokens
      summary: List your active API tokens (never their secret values)
      description: Token management requires a browser session; an API token cannot manage credentials. At most ten active API tokens per account.
      security: [{sessionCookie: []}]
      responses:
        '200':
          description: Bounded list of active API credentials, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/Credential'}}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
    post:
      operationId: createOwnAPIToken
      summary: Create a 30-day user-scoped API token
      description: Requires a browser session and CSRF token. The secret is returned only once and only its SHA-256 hash is stored. Token can read/update own profile/preferences and revoke itself, but cannot manage other credentials. At most ten active tokens; creations are limited to 20 per ten minutes per account across replicas.
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 80}
      responses:
        '201':
          description: New credential metadata and one-time secret.
          headers:
            Location: {schema: {type: string}, description: 'The credential path used for revocation.'}
          content:
            application/json:
              schema:
                type: object
                required: [item, token]
                properties:
                  item: {$ref: '#/components/schemas/Credential'}
                  token: {type: string, description: 'Use as Authorization: Bearer TOKEN.'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '409':
          description: Ten active API tokens already exist. Revoke one first.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '429': {$ref: '#/components/responses/AccountRateLimited'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
  /api/v1/me/tokens/{credential_id}:
    delete:
      operationId: revokeOwnAPIToken
      summary: Revoke an own credential
      description: Requires a browser session and CSRF token. Missing or another owner's credential is an idempotent no-op and reveals no ownership information.
      security: [{sessionCookie: []}]
      parameters:
        - {name: credential_id, in: path, required: true, schema: {$ref: '#/components/schemas/AccountID'}}
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Credential revoked or already absent.}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
  /api/v1/me/session:
    delete:
      operationId: revokeCurrentCredential
      summary: Revoke the current browser session or API token
      description: Cookie writes require X-CSRF-Token and a same-origin request. Bearer writes revoke that API token without CSRF. Subsequent requests using a revoked credential return 401.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Current credential revoked. Browser session cookie is also cleared.}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '503': {$ref: '#/components/responses/AccountsUnavailable'}
  /api/v1/me/saved-events:
    get:
      operationId: listSavedEvents
      summary: List your private saved events
      description: |
        Owner-only last-known event snapshots, newest saved first with a binary
        event-ID tie-breaker. No provider requests are made. Repeated saves keep
        saved_at unchanged. Cursors are bound to the owner; pass next_cursor to
        continue. New saves appear on refresh; removals can shorten later pages.
        Unknown/repeated parameters are rejected. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
        - {name: cursor, in: query, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: Your saved collection, including an empty array when no events are saved.
          headers:
            Cache-Control: {description: Private responses must not be stored., schema: {type: string, const: 'private, no-store'}}
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SavedEvent'}}
                  next_cursor: {type: [string, 'null']}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/SavesUnavailable'}
  /api/v1/me/saved-events/states:
    get:
      operationId: getSavedEventStates
      summary: Read your saved state for a bounded batch of events
      description: |
        Owner-only state without provider requests or metadata. Only event_id is
        accepted; repeat it for up to 101 entries. Absent keys in states mean not
        saved. Browser responses include the current CSRF token to revalidate
        restored controls; bearer responses omit it. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters:
        - name: event_id
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 101
            items: {$ref: '#/components/schemas/ResourceID'}
      responses:
        '200':
          description: Only the authenticated owner's bookmark state.
          content:
            application/json:
              schema:
                type: object
                required: [states]
                properties:
                  states: {type: object, additionalProperties: {type: boolean}}
                  csrf_token: {type: string}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/SavesUnavailable'}
  /api/v1/me/saved-events/{event_id}:
    parameters:
      - {name: event_id, in: path, required: true, schema: {$ref: '#/components/schemas/ResourceID'}}
    get:
      operationId: getSavedEvent
      summary: Read one of your private saved events
      description: No query parameters. Returns 404 for an event not saved by you, regardless of another account's saves. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      responses:
        '200':
          description: Your bookmark and its last-known event snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedEvent'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/SavedEventNotFound'}
        '503': {$ref: '#/components/responses/SavesUnavailable'}
    put:
      operationId: saveEvent
      summary: Save an event privately
      description: |
        Empty body and no query parameters. Resolve server-owned metadata, then
        atomically store event identity, a full last-known snapshot and an owner-only
        bookmark. Retry-safe: repeated PUT preserves saved_at and needs no provider
        call once saved. A retained snapshot can be saved during an outage.
        Does not publish interest, recommendations or attendance or reserve tickets.
        Cookie writes require X-CSRF-Token and same-origin checks; bearer writes do not.
        All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '201':
          description: Bookmark created.
          headers:
            Location: {description: Owner-only bookmark resource., schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedEvent'}
        '200':
          description: Existing bookmark, with its original saved_at.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SavedEvent'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '404': {$ref: '#/components/responses/SavedEventNotFound'}
        '503': {$ref: '#/components/responses/SavesUnavailable'}
    delete:
      operationId: removeSavedEvent
      summary: Remove an event from your private collection
      description: Empty body and no query parameters. Idempotent and owner-only; absent bookmarks are successful no-ops. Does not remove durable event metadata. Cookie writes require CSRF and same-origin checks. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Bookmark removed or already absent.}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '503': {$ref: '#/components/responses/SavesUnavailable'}
  /api/v1/me/event-interests:
    get:
      operationId: listOwnEventInterests
      summary: List your event interest, including private choices
      description: |
        Last-known event snapshots without provider calls, ordered by interested_at
        then binary event ID descending. Cursors are owner- and audience-bound.
        New choices appear on refresh; removals and visibility changes can shorten
        later pages. Unknown/repeated parameters are rejected. Responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters:
        - {$ref: '#/components/parameters/InterestLimit'}
        - {$ref: '#/components/parameters/InterestCursor'}
      responses:
        '200':
          description: Your event interest, or an empty array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventInterestList'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/InterestsUnavailable'}
  /api/v1/me/event-interests/states:
    get:
      operationId: getOwnEventInterestStates
      summary: Read aggregate counts and your own choices in a bounded batch
      description: |
        Repeat event_id up to 101 times; no other parameters or provider calls.
        Counts include private and public choices. Interested/visibility belong
        only to the authenticated owner; no other account identities are returned.
        Browser responses include csrf_token; bearer responses omit it.
        default_visibility applies to new choices only. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters:
        - name: event_id
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 101
            items: {$ref: '#/components/schemas/ResourceID'}
      responses:
        '200':
          description: A state for each requested ID; unknown IDs have count zero and interested false.
          content:
            application/json:
              schema:
                type: object
                required: [states, default_visibility]
                properties:
                  states: {type: object, additionalProperties: {$ref: '#/components/schemas/EventInterestState'}}
                  csrf_token: {type: string}
                  default_visibility: {type: string, enum: [private, public]}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/InterestsUnavailable'}
  /api/v1/me/event-interests/{event_id}:
    parameters:
      - {name: event_id, in: path, required: true, schema: {$ref: '#/components/schemas/ResourceID'}}
    get:
      operationId: getOwnEventInterest
      summary: Read your interest in an event
      description: Owner-only. No query parameters. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      responses:
        '200':
          description: Your choice and retained event metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventInterest'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/InterestNotFound'}
        '503': {$ref: '#/components/responses/InterestsUnavailable'}
    put:
      operationId: setOwnEventInterest
      summary: Mark Interested or change the visibility of your choice
      description: |
        A JSON object is required; send {} or {"visibility":"private"} or
        {"visibility":"public"}. Omission preserves an existing choice, or uses
        the account's private-by-default profile setting for a new choice.
        Public choices disclose your public profile on event participant lists
        and the event on your public profile. Changing the profile default never
        changes existing choices. No query parameters or client-supplied owner or metadata.
        Identity, snapshot, and first interest commit atomically. Repeated PUT
        preserves interested_at and needs no provider call for an existing choice.
        Separate from saves, recommendations, tickets, and attendance.
        Cookie writes require CSRF and same-origin checks; bearer writes do not.
        All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                visibility: {type: string, enum: [private, public]}
      responses:
        '201':
          description: Interest created.
          headers:
            Location: {description: Owner-only interest resource., schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventInterest'}
        '200':
          description: Existing interest, retaining its original interested_at.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventInterest'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '404': {$ref: '#/components/responses/InterestNotFound'}
        '503': {$ref: '#/components/responses/InterestsUnavailable'}
    delete:
      operationId: removeOwnEventInterest
      summary: Remove your event interest without changing your save
      description: Empty body and no query parameters. Owner-only and idempotent, including when absent. Retains shared event metadata and other users' interest. Cookie writes require CSRF and same-origin checks. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters: [{$ref: '#/components/parameters/CSRFToken'}]
      responses:
        '204': {description: Interest removed or already absent.}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '503': {$ref: '#/components/responses/InterestsUnavailable'}
  /api/v1/events/{event_id}/interest:
    get:
      operationId: getEventInterestCount
      summary: Read an event's aggregate interest count without identities
      description: Public read including private choices. No query parameters or provider calls. Unknown event IDs have count zero. All responses are private, no-store, so visibility changes take effect on the next read.
      parameters:
        - {name: event_id, in: path, required: true, schema: {$ref: '#/components/schemas/ResourceID'}}
      responses:
        '200':
          description: Aggregate only; no personal state or identity.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                additionalProperties: false
                properties:
                  count: {type: integer, minimum: 0}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '503': {$ref: '#/components/responses/InterestsUnavailable'}
  /api/v1/events/{event_id}/interested-users:
    get:
      operationId: listPublicInterestedUsers
      summary: List only explicitly public interest identities for an event
      description: |
        Public allowlisted profiles only, never email or private choices. Ordered
        by interested_at then binary account ID descending. Cursors are bound to
        this event. No provider calls; unknown events return an empty array.
        Removals/visibility changes can shorten pages. All responses are private, no-store.
      parameters:
        - {name: event_id, in: path, required: true, schema: {$ref: '#/components/schemas/ResourceID'}}
        - {$ref: '#/components/parameters/InterestLimit'}
        - {$ref: '#/components/parameters/InterestCursor'}
      responses:
        '200':
          description: Public profiles with their interest timestamps, or an empty array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterestParticipants'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '503': {$ref: '#/components/responses/InterestsUnavailable'}
  /api/v1/users/{user_id}/event-interests:
    get:
      operationId: listPublicProfileEventInterests
      summary: List an account's explicitly public event interest
      description: |
        Public event activity only; private choices and saves are never included,
        even for the owner. Last-known snapshots require no provider calls. Ordered
        by interested_at then binary event ID descending. Cursors are account-
        and audience-bound. All responses are private, no-store.
      parameters:
        - {name: user_id, in: path, required: true, schema: {$ref: '#/components/schemas/AccountID'}}
        - {$ref: '#/components/parameters/InterestLimit'}
        - {$ref: '#/components/parameters/InterestCursor'}
      responses:
        '200':
          description: Only public interest, with visibility always public.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventInterestList'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '404':
          description: Account not found, including an invalid account ID.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {$ref: '#/components/responses/InterestsUnavailable'}
  /api/v1/recommendations:
    get:
      operationId: listCommunityRecommendations
      summary: Browse public recommendations by city and category
      description: |
        Public endorsements, one per account/event, with optional plain-text reasons
        and allowlisted profiles. Multiple people can independently endorse the same
        event. Ordered by original recommended_at, then binary event ID and account
        ID descending; edits do not bump publication ordering. Filters use retained
        event snapshots, not provider requests. No private saves, interest identities,
        email or preferences appear. All responses are private, no-store, so withdrawal
        affects subsequent reads. Only the listed parameters, each once, are accepted.
      parameters:
        - {name: city, in: query, description: 'Case-insensitive exact city name, trimmed; no wildcard matching.', schema: {type: string, maxLength: 120}}
        - {name: country, in: query, description: Optional two-letter country code., schema: {type: string, pattern: '^[A-Za-z]{2}$'}}
        - {name: category_id, in: query, description: Event segment ID; all or omission removes this filter., schema: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}}
        - {$ref: '#/components/parameters/InterestLimit'}
        - {$ref: '#/components/parameters/RecommendationCursor'}
      responses:
        '200':
          description: Recent public endorsements, or an empty array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecommendationList'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '503': {$ref: '#/components/responses/RecommendationsUnavailable'}
  /api/v1/me/event-recommendations:
    get:
      operationId: listOwnEventRecommendations
      summary: List your published recommendations
      description: Original publication ordering and last-known event snapshots. Recommendations are public even when your interest is private. Cursors are owner-bound. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters:
        - {$ref: '#/components/parameters/InterestLimit'}
        - {$ref: '#/components/parameters/RecommendationCursor'}
      responses:
        '200':
          description: Your endorsements, or an empty array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecommendationList'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '503': {$ref: '#/components/responses/RecommendationsUnavailable'}
  /api/v1/me/event-recommendations/{event_id}:
    parameters:
      - {name: event_id, in: path, required: true, schema: {type: string, pattern: '^ticketmaster:[A-Za-z0-9_-]{1,128}$'}}
    get:
      operationId: getOwnEventRecommendation
      summary: Read your recommendation for an event
      description: No query parameters. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      responses:
        '200':
          description: Your public recommendation and retained event snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecommendation'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/RecommendationNotFound'}
        '503': {$ref: '#/components/responses/RecommendationsUnavailable'}
    put:
      operationId: setOwnEventRecommendation
      summary: Publish a public recommendation or replace its optional reason
      description: |
        Explicitly publishes your display name/profile and optional reason on the
        event, community collection and public profile. Does not change Save,
        Interested, attendance or posts. Omitted reason or an empty string clears
        the reason; null, repeated/unknown fields, client owner/metadata/visibility
        and query parameters are rejected. Reasons use valid UTF-8 plain text up
        to 500 Unicode characters, with surrounding whitespace trimmed. New
        identity/snapshot/recommendation commit atomically. Edits/retries preserve
        recommended_at; unchanged reasons also preserve updated_at. Existing edits
        need no provider call. Cookie writes require CSRF and same-origin checks;
        bearer writes do not use ambient cookies. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: string, maxLength: 500, default: ''}
      responses:
        '201':
          description: Public recommendation created.
          headers:
            Location: {description: Own recommendation resource., schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecommendation'}
        '200':
          description: Existing recommendation, with its optional reason replaced.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecommendation'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '404': {$ref: '#/components/responses/RecommendationNotFound'}
        '503': {$ref: '#/components/responses/RecommendationsUnavailable'}
    delete:
      operationId: withdrawOwnEventRecommendation
      summary: Withdraw your recommendation without changing other activity
      description: Empty body and no query parameters. Owner-only, idempotent 204 even when absent. Retains shared metadata and other accounts' recommendations, saves and interest. Cookie writes require CSRF and same-origin checks. All responses are private, no-store.
      security: [{sessionCookie: []}, {bearerToken: []}]
      parameters:
        - {$ref: '#/components/parameters/CSRFToken'}
      responses:
        '204': {description: Recommendation withdrawn or already absent.}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/CSRFRejected'}
        '503': {$ref: '#/components/responses/RecommendationsUnavailable'}
  /api/v1/events/{event_id}/recommendations:
    get:
      operationId: listEventRecommendations
      summary: Read public event recommendations and their count
      description: Count means explicit recommendations, not interest or Helpful. Unknown valid event IDs return zero and an empty array without provider calls. Ordered by original publication and binary IDs descending. All responses are private, no-store.
      parameters:
        - {name: event_id, in: path, required: true, schema: {type: string, pattern: '^ticketmaster:[A-Za-z0-9_-]{1,128}$'}}
        - {$ref: '#/components/parameters/InterestLimit'}
        - {$ref: '#/components/parameters/RecommendationCursor'}
      responses:
        '200':
          description: Public recommendations and total explicit endorsements for this event.
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: '#/components/schemas/EventRecommendationList'}
                  - {type: object, required: [count]}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '503': {$ref: '#/components/responses/RecommendationsUnavailable'}
  /api/v1/users/{user_id}/event-recommendations:
    get:
      operationId: listPublicProfileRecommendations
      summary: Read an account's public recommendations
      description: Public endorsements independently of interest privacy. Only allowlisted public profile fields are included. Original publication ordering, retained snapshots, and public-account-bound cursors. All responses are private, no-store.
      parameters:
        - {name: user_id, in: path, required: true, schema: {$ref: '#/components/schemas/AccountID'}}
        - {$ref: '#/components/parameters/InterestLimit'}
        - {$ref: '#/components/parameters/RecommendationCursor'}
      responses:
        '200':
          description: This account's public recommendations, or an empty array.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventRecommendationList'}
        '400': {$ref: '#/components/responses/AccountBadRequest'}
        '404':
          description: Account not found, including an invalid account ID.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '503': {$ref: '#/components/responses/RecommendationsUnavailable'}
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: Read this contract
      responses:
        '200':
          description: OpenAPI 3.1 contract.
          content:
            application/yaml:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ticketopia_session
      description: 'HttpOnly, Secure, SameSite=Lax cookie issued after Google sign-in. Local HTTP development uses ticketopia_session instead.'
    bearerToken:
      type: http
      scheme: bearer
      description: Opaque, expiring user-scoped API credential created in an authenticated browser. Not a Google access token or ID token.
  parameters:
    RecommendationCursor:
      name: cursor
      in: query
      description: Opaque next_cursor bound to this collection, owner/public audience, event and normalized community filters.
      schema: {type: string, maxLength: 1024}
    InterestLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    InterestCursor:
      name: cursor
      in: query
      description: Opaque next_cursor from this collection and audience.
      schema: {type: string, maxLength: 512}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      description: Required for every cookie-authenticated write. Read csrf_token from GET /api/v1/me. Not required with an API bearer token. Supplied Origin/Referer must match AUTH_BASE_URL.
      schema: {type: string}
  responses:
    RecommendationNotFound:
      description: This owner has no recommendation, or the event cannot be resolved for first publication.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    RecommendationsUnavailable:
      description: Accounts/recommendations are disabled, storage is unavailable, or event data cannot be resolved. No fabricated count or in-memory fallback.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InterestNotFound:
      description: Event cannot be resolved for a new choice, or this owner has no interest in it.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    InterestsUnavailable:
      description: Accounts or interest are disabled, durable storage is unavailable, or a new event cannot be resolved and no snapshot exists. No in-memory fallback.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    SavedEventNotFound:
      description: This event cannot be resolved for saving, or is not saved by the authenticated owner for a bookmark read.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    SavesUnavailable:
      description: Accounts/saves are disabled, durable storage is unavailable, or provider data cannot be resolved and no last-known snapshot exists. No in-memory fallback.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AccountBadRequest:
      description: Unsupported query, invalid JSON/form fields or values, or a request body exceeding 16 KiB.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: Missing, expired, revoked, wrong-kind, or invalid credentials. Credential management requires a browser session.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    CSRFRejected:
      description: Invalid or missing CSRF token, or a cross-origin cookie write.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AccountsUnavailable:
      description: Accounts are disabled or durable account storage is unavailable. No in-memory authentication fallback.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    AccountRateLimited:
      description: Shared authentication or credential-creation rate limit exceeded.
      headers:
        Retry-After: {schema: {type: integer, const: 600}, description: Wait ten minutes before retrying.}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    BadRequest:
      description: Invalid query or ID, or filters rejected by Ticketmaster. Local validation failures make no provider request.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unavailable:
      description: Provider outage, timeout, missing key, or exhausted request budget with no usable cached data.
      headers:
        Retry-After:
          description: Seconds until retry, when known.
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    EventRecommendation:
      type: object
      additionalProperties: false
      required: [event, profile, reason, recommended_at, updated_at, meta]
      properties:
        event: {$ref: '#/components/schemas/Event'}
        profile: {$ref: '#/components/schemas/PublicProfile'}
        reason: {type: string, maxLength: 500, description: 'Optional reason as plain text, never trusted HTML.'}
        recommended_at: {type: string, format: date-time, description: Original publication time; edits and retries preserve ordering.}
        updated_at: {type: string, format: date-time, description: Last reason change; unchanged retries preserve this time.}
        meta: {$ref: '#/components/schemas/Freshness'}
    EventRecommendationList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EventRecommendation'}}
        next_cursor: {type: [string, 'null']}
        count: {type: integer, minimum: 0, description: 'Total endorsements for the event; present only on event-scoped reads, independently of pagination.'}
    EventInterest:
      type: object
      required: [event, interested_at, visibility, meta]
      properties:
        event: {$ref: '#/components/schemas/Event'}
        interested_at: {type: string, format: date-time, description: 'Original choice time, preserved by retries and visibility changes.'}
        visibility: {type: string, enum: [private, public]}
        meta: {$ref: '#/components/schemas/Freshness'}
    EventInterestList:
      type: object
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/EventInterest'}}
        next_cursor: {type: [string, 'null']}
    EventInterestState:
      type: object
      required: [count, interested]
      additionalProperties: false
      properties:
        count: {type: integer, minimum: 0}
        interested: {type: boolean}
        visibility: {type: string, enum: [private, public], description: Present only when this owner is interested.}
    InterestParticipants:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
            required: [profile, interested_at]
            properties:
              profile: {$ref: '#/components/schemas/PublicProfile'}
              interested_at: {type: string, format: date-time}
        next_cursor: {type: [string, 'null']}
    SavedEvent:
      type: object
      required: [event, saved_at, meta]
      properties:
        event: {$ref: '#/components/schemas/Event'}
        saved_at: {type: string, format: date-time, description: 'Original bookmark creation time, unchanged by repeated saves.'}
        meta:
          allOf:
            - {$ref: '#/components/schemas/Freshness'}
          description: Snapshot collection time. stale is always true for stored bookmark reads; no current-provider freshness is implied.
    AccountID:
      type: string
      pattern: '^[0-9a-f]{32}$'
    PublicProfile:
      type: object
      additionalProperties: false
      required: [id, display_name, bio]
      properties:
        id: {$ref: '#/components/schemas/AccountID'}
        display_name: {type: string, minLength: 1, maxLength: 80}
        bio: {type: string, maxLength: 500}
    OwnProfile:
      type: object
      required: [id, display_name, bio, interest_visibility]
      properties:
        id: {$ref: '#/components/schemas/AccountID'}
        display_name: {type: string, minLength: 1, maxLength: 80}
        bio: {type: string, maxLength: 500}
        interest_visibility: {type: string, enum: [private, public], default: private}
    Preferences:
      type: object
      required: [city, country, timezone, category_ids, email_reminders, weekly_digest, notifications_paused]
      properties:
        city: {type: string, maxLength: 120, description: 'At most 120 UTF-8 bytes.'}
        country: {type: string, pattern: '^([A-Z]{2})?$'}
        timezone: {type: string, maxLength: 64, default: UTC}
        category_ids: {type: array, maxItems: 16, uniqueItems: true, items: {type: string}}
        email_reminders: {type: boolean, default: false}
        weekly_digest: {type: boolean, default: false}
        notifications_paused: {type: boolean, default: true}
    Account:
      type: object
      required: [id, display_name, bio, interest_visibility, email, preferences, created_at]
      properties:
        id: {$ref: '#/components/schemas/AccountID'}
        display_name: {type: string}
        bio: {type: string}
        interest_visibility: {type: string, enum: [private, public]}
        email: {type: string, description: Private email from the verified Google identity; never used to link accounts.}
        preferences: {$ref: '#/components/schemas/Preferences'}
        created_at: {type: string, format: date-time}
    Credential:
      type: object
      additionalProperties: false
      required: [id, kind, name, created_at, expires_at]
      properties:
        id: {$ref: '#/components/schemas/AccountID'}
        kind: {type: string, const: api}
        name: {type: string, maxLength: 80}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    ResourceID:
      type: string
      pattern: '^ticketmaster:[A-Za-z0-9_-]{1,128}$'
    Freshness:
      type: object
      required: [data_as_of, stale]
      properties:
        data_as_of: {type: string, format: date-time, description: 'When this data was successfully collected, not when this response was served.'}
        stale: {type: boolean, description: A refresh failed or was paused and retained data is being served.}
    Source:
      type: object
      required: [provider, id, url]
      properties:
        provider: {type: string, const: ticketmaster}
        id: {type: string}
        url: {type: string, description: 'Original source URL, or an empty string if unavailable.'}
    NamedID:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    Genre:
      allOf:
        - {$ref: '#/components/schemas/NamedID'}
        - type: object
          required: [subgenres]
          properties:
            subgenres: {type: array, items: {$ref: '#/components/schemas/NamedID'}}
    NullableInstant:
      type: [string, 'null']
      format: date-time
    EventStart:
      type: object
      required: [date_time, local_date, local_time, timezone, date_tba, date_tbd, time_tba, no_specific_time]
      properties:
        date_time: {$ref: '#/components/schemas/NullableInstant'}
        local_date: {type: [string, 'null'], description: Provider local date; TBA/TBD flags override any placeholder value.}
        local_time: {type: [string, 'null'], description: Provider local time; time_tba and no_specific_time override placeholder values.}
        timezone: {type: [string, 'null']}
        date_tba: {type: boolean}
        date_tbd: {type: boolean}
        time_tba: {type: boolean}
        no_specific_time: {type: boolean}
    PublicSale:
      type: object
      required: [start, end, start_tbd]
      properties:
        start: {$ref: '#/components/schemas/NullableInstant'}
        end: {$ref: '#/components/schemas/NullableInstant'}
        start_tbd: {type: boolean}
    Presale:
      type: object
      required: [name, description, url, start, end]
      properties:
        name: {type: string}
        description: {type: string}
        url: {type: string}
        start: {$ref: '#/components/schemas/NullableInstant'}
        end: {$ref: '#/components/schemas/NullableInstant'}
    PriceRange:
      type: object
      required: [type, currency, min, max, fees_included]
      properties:
        type: {type: string}
        currency: {type: string}
        min: {type: [string, 'null'], description: Decimal amount preserved without floating-point conversion.}
        max: {type: [string, 'null'], description: Decimal amount preserved without floating-point conversion.}
        fees_included: {type: [boolean, 'null'], description: Null when the source does not establish fee inclusion.}
    Image:
      type: object
      required: [url, width, height, ratio, fallback]
      properties:
        url: {type: string}
        width: {type: integer}
        height: {type: integer}
        ratio: {type: string}
        fallback: {type: boolean}
    Artist:
      type: object
      required: [id, name, source]
      properties:
        id: {$ref: '#/components/schemas/ResourceID'}
        name: {type: string}
        source: {$ref: '#/components/schemas/Source'}
    Place:
      type: object
      required: [name, address, city, state, country, country_code, postal_code, latitude, longitude]
      properties:
        name: {type: string}
        address: {type: string}
        city: {type: string}
        state: {type: string}
        country: {type: string}
        country_code: {type: string}
        postal_code: {type: string}
        latitude: {type: string}
        longitude: {type: string}
    Venue:
      allOf:
        - {$ref: '#/components/schemas/Place'}
        - type: object
          required: [id, source, timezone]
          properties:
            id: {$ref: '#/components/schemas/ResourceID'}
            source: {$ref: '#/components/schemas/Source'}
            timezone: {type: string}
    Classification:
      type: object
      required: [primary, segment, genre, subgenre]
      properties:
        primary: {type: boolean}
        segment: {anyOf: [{$ref: '#/components/schemas/NamedID'}, {type: 'null'}]}
        genre: {anyOf: [{$ref: '#/components/schemas/NamedID'}, {type: 'null'}]}
