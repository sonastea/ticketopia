# Disposable local development only; no HA or backup/restore guarantee.
# Versioned volume keeps older engine data intact; see docs/persistence.md.
name: ticketopia-db
services:
  mariadb:
    image: mariadb:13.0.2
    environment:
      MARIADB_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:3307:3306"
    command:
      - --default-time-zone=+00:00
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-buffer-pool-instances=1 # Compatibility-only; ignored by MariaDB 13.0.
      - --max-connections=60
      - --key-buffer-size=107374182 # Approximately 102.4 MiB, in whole bytes.
      - --innodb-log-file-size=128M
      - --tmp-table-size=53687091 # Approximately 51.2 MiB, in whole bytes.
      - --innodb-log-buffer-size=10737418 # Approximately 10.24 MiB, in whole bytes.
      - --innodb-flush-log-at-trx-commit=1
      - --innodb-flush-method=O_DIRECT
      - --innodb-file-per-table=1
      - --innodb-io-capacity=100
      - --innodb-read-io-threads=4
      - --innodb-write-io-threads=4
      - --innodb-thread-concurrency=0 # Compatibility-only; ignored by MariaDB 13.0.
      - --sort-buffer-size=8M
      - --read-buffer-size=4M
      - --read-rnd-buffer-size=8M
      - --join-buffer-size=4M
      - --innodb-flush-neighbors=0
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    volumes:
      - data-v13:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ../../.local/mariadb/certs:/certs:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  data-v13:
