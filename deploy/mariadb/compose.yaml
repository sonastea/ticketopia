# Disposable local development only; no HA or backup/restore guarantee.
name: ticketopia-db
services:
  mariadb:
    image: mariadb:11.8.6
    environment:
      MARIADB_ROOT_PASSWORD: local-root-only
    ports:
      - "127.0.0.1:3307:3306"
    command:
      - --default-time-zone=+00:00
      - --default-storage-engine=InnoDB
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
      - --ssl-ca=/certs/ca.crt
      - --ssl-cert=/certs/server.crt
      - --ssl-key=/certs/server.key
    volumes:
      - data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-users.sql:ro
      - ../../.local/mariadb/certs:/certs:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  data:
