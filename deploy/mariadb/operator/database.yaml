# The existing database-wide SELECT grant covers role reads. Runtime deliberately
# receives no write grants on account_roles or account_role_events.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticketopia-db-config
  namespace: ticketopia
data:
  PERSISTENCE_MODE: mariadb
  DB_HOST: ticketopia-db.ticketopia.svc.cluster.local
  DB_PORT: "3306"
  DB_NAME: ticketopia
  DB_TLS_MODE: verify-full
  DB_TLS_CA_FILE: /etc/ticketopia/db/ca.crt
  DB_MAX_OPEN: "10"
  DB_MAX_IDLE: "2"
  DB_CONN_LIFETIME: 5m
  DB_CONN_IDLE_TIME: 1m
  DB_DIAL_TIMEOUT: 3s
  DB_READ_TIMEOUT: 5s
  DB_WRITE_TIMEOUT: 5s
  DB_STARTUP_TIMEOUT: 10s
  DB_QUERY_TIMEOUT: 3s
  DB_READY_TIMEOUT: 500ms
  DB_MIGRATION_TIMEOUT: 2m
---
