name: Publish app image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # Never execute pull requests or manually selected feature branches here.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require private package and repository access
        id: package
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const namespace = repository.owner.type === 'Organization' ? 'orgs' : 'users';
            const path = `/${namespace}/${owner}/packages/container/${repo.toLowerCase()}`;

            let pkg;
            try {
              ({ data: pkg } = await github.request(`GET ${path}`));
            } catch (error) {
              if (error.status === 404) {
                throw new Error(
                  'The private GHCR package must exist and grant this repository ' +
                  'Write access under Manage Actions access.'
                );
              }
              throw error;
            }

            if (pkg.visibility !== 'private') {
              throw new Error('Refusing to publish: the GHCR package is not private.');
            }

            core.setOutput('path', path);
            core.setOutput('image', `ghcr.io/${owner.toLowerCase()}/${repo.toLowerCase()}`);

            // Isolate registry credentials from the runner account's Docker config.
            core.exportVariable(
              'DOCKER_CONFIG',
              require('fs').mkdtempSync(`${process.env.RUNNER_TEMP}/ticketopia-docker-`)
            );

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build assets and validate Go in Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: validate
          platforms: linux/amd64
          # Always run the tests; reuse cached dependency and asset build layers.
          no-cache-filters: validate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.package.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag

      - name: Build and publish amd64 app image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify private pulls and record image digest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          IMAGE: ${{ steps.package.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        with:
          script: |
            const { data: pkg } = await github.request(`GET ${process.env.PACKAGE_PATH}`);
            if (pkg.visibility !== 'private') {
              throw new Error('The published GHCR package is not private.');
            }

            const repository = process.env.IMAGE.slice('ghcr.io/'.length);
            const url = new URL('https://ghcr.io/token');
            url.searchParams.set('service', 'ghcr.io');
            url.searchParams.set('scope', `repository:${repository}:pull`);

            const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
            let status = response.status;

            if (status === 200) {
              const body = await response.json();
              const token = body.token || body.access_token;
              if (!token) {
                throw new Error('Anonymous pull check returned no token.');
              }

              const manifest = await fetch(
                `https://ghcr.io/v2/${repository}/manifests/${process.env.DIGEST}`,
                {
                  headers: {
                    Authorization: `Bearer ${token}`,
                    Accept: 'application/vnd.oci.image.index.v1+json, ' +
                      'application/vnd.docker.distribution.manifest.list.v2+json'
                  },
                  signal: AbortSignal.timeout(30000)
                }
              );
              status = manifest.status;
            }

            if (![401, 403].includes(status)) {
              throw new Error(`Anonymous pulls were not verified as denied (HTTP ${status}).`);
            }

            await core.summary
              .addHeading('Ticketopia app image')
              .addCodeBlock(
                `${process.env.IMAGE}@${process.env.DIGEST}\n${process.env.IMAGE_TAGS}`,
                'text'
              )
              .addRaw('Platform: linux/amd64. Package visibility: private. Anonymous pulls: denied.\n')
              .write();
